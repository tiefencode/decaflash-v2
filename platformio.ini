[platformio]
default_envs = mainframe
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -I shared/include

[env:mainframe]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified@0.2.23
  m5stack/M5GFX@0.2.30
build_src_filter =
  -<*>
  +<apps/mainframe/src/>

; Device-only renderer comparison. The normal `mainframe` environment uses
; the procedural 48-triangle Sclera renderer. Each variant is flashed
; separately so its memory figures remain directly comparable.

[env:mainframe-eye-lowpoly-20]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=20
  -DDECAFLASH_EYE_BENCHMARK=1

[env:mainframe-eye-lowpoly-40]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=40
  -DDECAFLASH_EYE_BENCHMARK=1

; Same visible sclera facets as the sprite reference, regenerated slowly into
; one buffer instead of retaining the 45 precomputed frames.
[env:mainframe-eye-procedural]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=48
  -DDECAFLASH_EYE_BENCHMARK=1

[env:mainframe-eye-lowpoly-72]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=72
  -DDECAFLASH_EYE_BENCHMARK=1

[env:mainframe-eye-lowpoly-80]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=80
  -DDECAFLASH_EYE_BENCHMARK=1

[env:node]
platform = espressif32@6.13.0
board = m5stack-atom
; FastLED's deep scan visits optional source trees that are not used by Node.
lib_ldf_mode = chain
lib_deps =
  fastled/FastLED@3.10.3
build_src_filter =
  -<*>
  +<apps/node/src/>
