[platformio]
default_envs = mainframe
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -I shared/include

[env:mainframe]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  m5stack/M5Unified@0.2.23
  m5stack/M5GFX@0.2.30
build_src_filter =
  -<*>
  +<apps/mainframe/src/>

[env:node]
platform = espressif32@6.13.0
board = m5stack-atom
; FastLED's deep scan visits optional source trees that are not used by Node.
lib_ldf_mode = chain
lib_deps =
  fastled/FastLED@3.10.3
build_src_filter =
  -<*>
  +<apps/node/src/>
