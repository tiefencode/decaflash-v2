[platformio]
default_envs = mainframe
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -I shared/include

[env:mainframe]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; Model partition instead of the second app slot and SPIFFS (add-text-model,
; design.md Decision 12): no over-the-air update. The model image is written
; separately to 0x340000 (README.md); without one every text comes from the
; text bank.
board_build.partitions = apps/mainframe/partitions_slm.csv
build_flags =
  ${env.build_flags}
  -I apps/mainframe/src
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DDECAFLASH_SLM=1
lib_deps =
  m5stack/M5Unified@0.2.23
  m5stack/M5GFX@0.2.30
  sparkfun/SparkFun STHS34PF80 Arduino Library@1.0.5
build_src_filter =
  -<*>
  +<apps/mainframe/src/>

; The classic reaction texts (add-verse-text-bank). `mainframe` builds the
; verse bank; flash this environment to switch back to the classic bank.
[env:mainframe-classic]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_TEXT_BANK_CLASSIC=1

; Device-only renderer comparison. The normal `mainframe` environment uses
; the procedural 48-triangle Sclera renderer. Each variant is flashed
; separately so its memory figures remain directly comparable.

[env:mainframe-eye-lowpoly-20]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=20
  -DDECAFLASH_EYE_BENCHMARK=1

[env:mainframe-eye-lowpoly-40]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=40
  -DDECAFLASH_EYE_BENCHMARK=1

; Same visible sclera facets as the sprite reference, regenerated slowly into
; one buffer instead of retaining the 45 precomputed frames.
[env:mainframe-eye-procedural]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=48
  -DDECAFLASH_EYE_BENCHMARK=1

[env:mainframe-eye-lowpoly-72]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=72
  -DDECAFLASH_EYE_BENCHMARK=1

[env:mainframe-eye-lowpoly-80]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_EYE_RENDERER_MODE=80
  -DDECAFLASH_EYE_BENCHMARK=1

; Diagnostic-only BPM tracker V2. It leaves the production BeatAnalyzer and
; show clock in charge, and emits once-per-second A/B timing telemetry.
[env:mainframe-beat-tracker]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_BEAT_TRACKER_TELEMETRY=1

; Capture the actual 16 ms multi-band feature frames from the Atom for offline replay.
; This is deliberately a separate diagnostic firmware: it adds serial output,
; but no PCM retention or meaningful RAM to the normal application.
[env:mainframe-bpm-capture]
extends = env:mainframe-beat-tracker
build_flags =
  ${env:mainframe-beat-tracker.build_flags}
  -DDECAFLASH_BPM_TRACE=1

; Capture the twelve spectral feature values used by the replacement V2.
; This has no normal-build cost and drops trace lines rather than blocking I2S.
[env:mainframe-spectral-capture]
extends = env:mainframe-beat-tracker
build_flags =
  ${env:mainframe-beat-tracker.build_flags}
  -DDECAFLASH_SPECTRAL_TRACE=1

; Capture V2's compact onset-strength trace for repeatable V2 regression tests.
[env:mainframe-v2-capture]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_V2_TRACE=1

; Capture raw IMU activity below the motion classifier thresholds, to choose
; thresholds for the Mainframe's enclosure. The classifier itself is unchanged.
[env:mainframe-motion-capture]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_MOTION_TRACE=1

; Measure how much of core 1 the main loop uses: per-section timing, eye
; frames with and without a panel message, audio and IMU gaps, free memory.
; One LOOP_LOAD line per second; the line is skipped when serial is full.
[env:mainframe-loop-load]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_LOOP_LOAD=1

; Measurement only (openspec change reduce-panel-frame-rate): loop-load report
; plus a sweep that starts 80 s after the show: text on the panel at 25, 40,
; 50 and 67 ms under the panel, then no text at 25 and 40 ms, 15 s each.
; frame_ms= and panel_ms= in LOOP_A name the active intervals. Flash the
; normal `mainframe` build afterwards.
[env:mainframe-panel-rate-sweep]
extends = env:mainframe-loop-load
build_flags =
  ${env:mainframe-loop-load.build_flags}
  -DDECAFLASH_PANEL_RATE_SWEEP=1

; Measurement only: loop-load report plus the sections of every frame with the
; message panel (LOOP_G per second; PANEL_F for first and slow panel frames,
; GAP for audio gaps >= 60 ms and IMU gaps >= 55 ms). Flash the normal
; `mainframe` build afterwards.
[env:mainframe-panel-frame-timing]
extends = env:mainframe-loop-load
build_flags =
  ${env:mainframe-loop-load.build_flags}
  -DDECAFLASH_PANEL_FRAME_TIMING=1

; Measurement only: text model load capture (docs/slm-prototype.md). Runs the three states by itself: idle,
; then the show starts (a button press starts it earlier), show, then a
; gesture text event every 3 s, written by the text model; each phase lasts
; DECAFLASH_SLM_AUTO_RUN_PHASE_MIN minutes (code default 11, set to 1 here:
; short device tests, task 8.3 of add-text-model). Flash the
; normal `mainframe` build afterwards.
[env:mainframe-slm-capture]
extends = env:mainframe
build_flags =
  ${env:mainframe.build_flags}
  -DDECAFLASH_LOOP_LOAD=1
  -DDECAFLASH_SLM_AUTO_RUN=1
  -DDECAFLASH_SLM_AUTO_RUN_PHASE_MIN=1

; Measurement only: language model prototype benchmark (docs/slm-prototype.md,
; Decision 8). Only the model kernel, no audio, eye, radio or sensors; same
; board and partition table as `mainframe-slm-capture`. `-o3` builds everything
; with -O3 instead of the core's -Os, as the reference project does.
[env:slm-bench-core2]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = apps/mainframe/partitions_slm.csv
lib_ldf_mode = chain
build_flags =
  ${env.build_flags}
  -I apps/mainframe/src
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_src_filter =
  -<*>
  +<apps/slm-bench/src/>

[env:slm-bench-core2-o3]
extends = env:slm-bench-core2
build_unflags = -Os
build_flags =
  ${env:slm-bench-core2.build_flags}
  -O3

[env:node]
platform = espressif32@6.13.0
board = m5stack-atom
; FastLED's deep scan visits optional source trees that are not used by Node.
lib_ldf_mode = chain
lib_deps =
  fastled/FastLED@3.10.3
build_src_filter =
  -<*>
  +<apps/node/src/>
